<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="d-flex justify-content-center align-items-center vh-100">
        <h2 id="titulo">Login</h2>
        <form id="form-login">
            <div id="c-email" class="conjunto">
                <label for="nome-usuario">Usuário: </label>
                <input type="text" id="nome-usuario" placeholder="Informe seu nome de usuário" required>
            </div>
            <div id="c-senha" class="conjunto">
                <label for="senha">Senha: </label>
                <input type="password" id="senha" placeholder="Informe sua senha" required>
            </div>
            <button id="botao-envio" type="submit">Entrar</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>

</html>

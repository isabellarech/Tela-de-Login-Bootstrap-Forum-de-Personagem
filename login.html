<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="d-flex flex-column justify-content-center align-items-center vh-100">
        <h1 class="mb-5 text-center">
            Seja bem-vindo ao Fórum do Mike Wazowski
        </h1>
        <div class="card p-4 shadow" style="width: 300px;">

            <div class="d-flex p-2">
                <h2 id="titulo">Login</h2>
            </div>
            <div class="imagem">
                <img src="assets/Mike_Wazowski.png" alt="Mike Wazowski">
            </div>
            <form id="form-login">
                <div class="d-flex flex-column mb-3">
                    <div id="c-email" class="conjunto">
                        <label for="usuario">Usuário: </label>
                        <input type="text" class="form-control" id="usuario" placeholder="Informe seu nome de usuário"
                            required>
                    </div>
                    <div id="c-senha" class="conjunto">
                        <label for="senha">Senha: </label>
                        <input type="password" id="senha" class="form-control" placeholder="Informe sua senha" required>
                    </div>
                    <button id="botao-envio" type="submit" class="btn btn-success w-100 mt-3">Entrar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
